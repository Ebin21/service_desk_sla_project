{% extends "base.html" %}{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><div class="card p-4"><h1 class="h3 mb-3">{{ heading }}</h1>
<form method="post">{% csrf_token %}{{ form.non_field_errors }}
{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}
<div class="d-flex gap-2"><button class="btn btn-primary">Save ticket</button><a class="btn btn-outline-secondary" href="{% url 'ticket_list' %}">Cancel</a></div>
</form></div></div></div>{% endblock %}
