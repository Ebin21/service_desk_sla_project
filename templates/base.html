<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Service Desk SLA{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{background:#f5f7fb}.navbar-brand{font-weight:700}.card{border:0;box-shadow:0 2px 12px rgba(20,40,80,.06)}
    .metric{font-size:1.8rem;font-weight:700}.table thead th{white-space:nowrap}.small-muted{color:#6c757d;font-size:.9rem}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
 <div class="container"><a class="navbar-brand" href="{% url 'dashboard' %}">ServiceDesk</a>
 <div class="d-flex gap-3 align-items-center">
 {% if user.is_authenticated %}
 <a class="text-white text-decoration-none" href="{% url 'dashboard' %}">Dashboard</a>
 <a class="text-white text-decoration-none" href="{% url 'ticket_list' %}">Tickets</a>
 <a class="text-white text-decoration-none" href="{% url 'ticket_create' %}">New ticket</a>
 <span class="text-white-50">{{ user.username }}</span>
 <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-light btn-sm">Log out</button></form>
 {% endif %}
 </div></div>
</nav>
<main class="container py-4">
 {% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endif %}
 {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body></html>
